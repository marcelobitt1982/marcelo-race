<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Enduro - Atari 2600 no Telemóvel</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      font-family: Arial, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    #rotate-notice {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      color: #fff;
      z-index: 9999;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    @media screen and (max-orientation: portrait) {
      #rotate-notice {
        display: flex;
      }
    }

    /* Centraliza e dimensiona o jogo mantendo o aspeto clássico */
    #game-container {
      width: 100%;
      height: 100%;
      max-width: 960px;
      max-height: 720px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #game {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div id="rotate-notice">
    <div>
      <h2>🔄 Gire o telemóvel</h2>
      <p>Para uma melhor experiência a jogar Enduro, por favor, coloque o telemóvel na horizontal.</p>
    </div>
  </div>

  <div id="game-container">
    <div id="game"></div>
  </div>

  <script type="text/javascript">
    EJS_player = '#game';
    EJS_core = 'atari2600'; 
    EJS_gameUrl = 'enduro.bin'; 
    EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    
    EJS_mouse = false;
    EJS_multitouch = true;
    EJS_gamepad = true;       
    EJS_screenRecording = false;
    EJS_startOnLoaded = true; 
    EJS_settings = {
      virtualPad: true
    };
  </script>
  
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

  <!-- Script para detetar o botão de reset do emulador e alterar o texto para START -->
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const observer = new MutationObserver((mutations, obs) => {
        // Procura por elementos que contenham texto de reset ou botões de menu do emulador
        const buttons = document.querySelectorAll('button, div, span');
        buttons.forEach(el => {
          if (el.innerText && el.innerText.trim() === 'Reset') {
            el.innerText = 'START';
          }
        });
      });

      observer.observe(document.body, {
        childList: true,
        subtree: true
      });
    });
  </script>

</body>
</html>
