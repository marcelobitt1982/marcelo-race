<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Enduro - Atari 2600 no Telemóvel</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #111;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    
    #rotate-notice {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      color: #fff;
      z-index: 9999;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    @media screen and (max-orientation: portrait) {
      #rotate-notice {
        display: flex;
      }
    }

    #game-container {
      width: 100%;
      height: 100vh;
    }
  </style>
</head>
<body>

  <div id="rotate-notice">
    <div>
      <h2>🔄 Gire o telemóvel</h2>
      <p>Para uma melhor experiência a jogar Enduro, por favor, coloque o telemóvel na horizontal.</p>
    </div>
  </div>

  <div id="game-container">
    <div id="game" style="width:100%; height:100%;"></div>
  </div>

  <script type="text/javascript">
    EJS_player = '#game';
    EJS_core = 'atari2600'; 
    EJS_gameUrl = 'enduro.bin'; 
    EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    
    // Configurações para telemóvel e arranque automático sem tela inicial
    EJS_mouse = false;
    EJS_multitouch = true;
    EJS_gamepad = true;       
    EJS_screenRecording = false;
    EJS_startOnLoaded = true; // Ignora o menu inicial e arranca o jogo direto
    EJS_settings = {
      virtualPad: true
    };
  </script>
  
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
