<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="stylesheet" href="style.css">
<title>MARCELO RACE - Enduro</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color: white;
    font-family: 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    touch-action: none;
}

h1 {
    margin: 5px;
    font-size: 1.3rem;
    color: #f1c40f;
    text-shadow: 0 0 10px #f39c12;
    letter-spacing: 2px;
}

#game-container {
    border: 4px solid #555;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 10px 35px #000;
    background: #000;
}

canvas {
    display: block;
    width: 95vw;
    max-width: 650px;
    height: auto;
    image-rendering: pixelated;
}

.controls-mobile {
    display: flex;
    justify-content: space-between;
    width: 95vw;
    max-width: 650px;
    margin-top: 12px;
}

.btn {
    background: linear-gradient(#333,#111);
    color: white;
    border: 2px solid #666;
    font-size: 1rem;
    font-weight: bold;
    padding: 16px 25px;
    border-radius: 10px;
    user-select: none;
    touch-action: none;
}

.btn:active,
.btn.pressed {
    background: #f1c40f;
    color: black;
}

.info-pc {
    margin-top: 8px;
    font-size: 12px;
    color: #aaa;
}
</style>
</head>

<body>

<h1>MARCELO RACE</h1>

<div class="game-container">
    <h1>MARCELO RACE</h1>

    <div class="game-info">
        <div>Pontos: <span id="score">0</span></div>
        <div>Velocidade: <span id="speed">0</span></div>
        <div>Nível: <span id="level">1</span></div>
    </div>

    <canvas id="gameCanvas" width="700" height="650"></canvas>

    <div class="controls">
        <button id="btnLeft">◀</button>
        <button id="btnRight">▶</button>
    </div>

    <button id="restartButton">REINICIAR</button>

    <p class="instructions">
        Use as setas do teclado ou os botões para dirigir.
    </p>
</div>
<script src="game.js"></script>
<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;
const horizonY = 220;

const playerWidth = 48;
const playerHeight = 70;
const playerY = H - 110;

let playerX = W / 2 - playerWidth / 2;

let score = 0;
let gameOver = false;
let keys = {};

let enemies = [];
let spawnTimer = 0;

let roadDistance = 0;
let playerDrift = 0;
let lastTime = 0;

const roadTopWidth = 46;
const roadBottomWidth = 540;

// =====================================
// CONTROLES
// =====================================

window.addEventListener("keydown", e => {
    keys[e.key] = true;

    if (["ArrowLeft", "ArrowRight", " "].includes(e.key)) {
        e.preventDefault();
    }

    if (e.code === "Space" && gameOver) {
        resetGame();
    }
});

window.addEventListener("keyup", e => {
    keys[e.key] = false;
});

function setupButton(button, key) {
    button.addEventListener("pointerdown", e => {
        e.preventDefault();
        keys[key] = true;
        button.classList.add("pressed");
    });

    function release(e) {
        e.preventDefault();
        keys[key] = false;
        button.classList.remove("pressed");
    }

    button.addEventListener("pointerup", release);
    button.addEventListener("pointerleave", release);
    button.addEventListener("pointercancel", release);
}

setupButton(document.getElementById("btnLeft"), "ArrowLeft");
setupButton(document.getElementById("btnRight"), "ArrowRight");

// =====================================
// SISTEMA DE CURVAS ESTILO ENDURO
// =====================================

function curveAt(distance) {

    // Curvas longas e fortes
    let longCurve =
        Math.sin(distance * 0.00048) * 0.78;

    // Curvas intermediárias
    let mediumCurve =
        Math.sin(distance * 0.00105 + 1.7) * 0.38;

    // Curvas rápidas em S
    let sCurve =
        Math.sin(distance * 0.0021 + 0.6) * 0.22;

    // Pequenas mudanças de direção
    let detailCurve =
        Math.sin(distance * 0.00019 + 2.4) * 0.20;

    return longCurve + mediumCurve + sCurve + detailCurve;
}
