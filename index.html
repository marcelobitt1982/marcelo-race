
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050b0a">
    <title>MARCELO RACE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="topbar">
        <div class="logo">MARCELO <span>RACE</span></div>
        <div class="subtitle">MODERN ENDURANCE</div>
    </header>

    <main>
        <section class="game-container">

            <div class="hud">
                <div>
                    <small>VELOCIDADE</small>
                    <strong id="speed">000</strong>
                    <small>KM/H</small>
                </div>

                <div>
                    <small>PONTUAÇÃO</small>
                    <strong id="score">000000</strong>
                </div>

                <div>
                    <small>TEMPO</small>
                    <strong id="time">90</strong>
                </div>
            </div>

            <canvas id="gameCanvas"></canvas>

            <div class="overlay" id="overlay">
                <h1>MARCELO <span>RACE</span></h1>
                <p>THE ENDURANCE CHALLENGE</p>
                <button id="startButton">START RACE</button>
                <small>ULTRAPASSE. SOBREVIVA. VENÇA.</small>
            </div>

            <div class="game-message" id="message"></div>

            <div class="mobile-controls">
                <button id="leftButton">◀</button>
                <button id="rightButton">▶</button>
                <button id="accelerateButton">▲</button>
                <button id="brakeButton">▼</button>
            </div>

        </section>
    </main>

    <footer>
        <span>MARCELO RACE © 2026</span>
        <span>ARCADE RACING EXPERIENCE</span>
    </footer>

    <script src="game.js"></script>
</body>
</html>
